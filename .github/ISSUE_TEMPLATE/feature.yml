name: Function request
description: Request an account-manager function or improvement.
title: "[Function]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the user problem and the required result.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Main area
      options: [Discovery, Auth-only import, Full import, Account switching, Shared chats, GUI, CLI, Build and docs]
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Limits and alternatives
      description: List macOS or Linux, Codex, privacy, recovery, and accessibility limits.
