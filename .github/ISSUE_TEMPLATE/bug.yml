name: Defect report
description: Report an IIA Directeur GUI, core, or terminal defect.
title: "[Defect]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include keys, tokens, cookies, transcripts, prompts, or private paths.
  - type: input
    id: version
    attributes:
      label: Application version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 14 on Apple Silicon, or Ubuntu 24.04 on x86_64
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps and observed result
      description: Give the smallest steps and include the failed action or phase.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Remove credentials, account identity, transcript content, and private paths.
