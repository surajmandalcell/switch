name: Release native macOS package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      APP_PATH: /private/tmp/ai-manager-build/package/IIA Directeur.app
      CLI_PATH: /private/tmp/ai-manager-build/artifacts/ai-manager
      ARCHIVE_PATH: /private/tmp/ai-manager-build/IIA-Directeur-${{ github.ref_name }}.zip
      KEYCHAIN_PATH: ${{ runner.temp }}/iia-directeur-signing.keychain-db
      CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
      NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      PAYLOAD_PATH: ${{ runner.temp }}/IIA Directeur
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify core contracts
        run: scripts/check-native.sh
      - name: Import Developer ID identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build Developer ID app and CLI
        env:
          AI_MANAGER_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          test -n "$AI_MANAGER_SIGNING_IDENTITY"
          case "$AI_MANAGER_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) printf '%s\n' 'MACOS_DEVELOPER_ID_APPLICATION must name a Developer ID Application identity.' >&2; exit 2 ;;
          esac
          AI_MANAGER_VERSION="${GITHUB_REF_NAME#v}" scripts/build-native.sh
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F "Authority=$AI_MANAGER_SIGNING_IDENTITY"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F 'flags=0x10000(runtime)'
          codesign -dv --verbose=4 "$CLI_PATH" 2>&1 | grep -F 'flags=0x10000(runtime)'
      - name: Verify CLI workflows
        run: bash packages/tui/Tests/acceptance.sh "$CLI_PATH"
      - name: Archive and notarize
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          umask 077
          test -n "$NOTARY_API_KEY_BASE64"
          test -n "$NOTARY_API_KEY_ID"
          test -n "$NOTARY_API_ISSUER_ID"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          mkdir -p "$PAYLOAD_PATH"
          ditto "$APP_PATH" "$PAYLOAD_PATH/IIA Directeur.app"
          install -m 0755 "$CLI_PATH" "$PAYLOAD_PATH/ai-manager"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_PATH" "$ARCHIVE_PATH"
          xcrun notarytool submit "$ARCHIVE_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$PAYLOAD_PATH/IIA Directeur.app"
          xcrun stapler validate "$PAYLOAD_PATH/IIA Directeur.app"
          spctl --assess --type execute --verbose=4 "$PAYLOAD_PATH/IIA Directeur.app"
          spctl --assess --type execute --verbose=4 "$PAYLOAD_PATH/ai-manager"
          scripts/check-release-readiness.sh --public \
            "$PAYLOAD_PATH/IIA Directeur.app" \
            "$PAYLOAD_PATH/ai-manager"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_PATH" "$ARCHIVE_PATH"
          shasum -a 256 "$ARCHIVE_PATH" > "/private/tmp/ai-manager-build/checksums-${GITHUB_REF_NAME}.txt"
      - name: Create release and upload verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            "$ARCHIVE_PATH" \
            "/private/tmp/ai-manager-build/checksums-${GITHUB_REF_NAME}.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
