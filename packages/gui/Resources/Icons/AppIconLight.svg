<!-- Approved pixel-traced Switch mark on a graphite tile for light environments. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile-surface-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#383d45"/>
      <stop offset="0.48" stop-color="#292f37"/>
      <stop offset="1" stop-color="#1a2027"/>
    </linearGradient>
    <linearGradient id="edge-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lower-shade-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="pixel-mark-light" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024" style="mask-type:alpha">
      <image x="245" y="258" width="520" height="520" xlink:href="SwitchMarkPixelTrace.svg"/>
    </mask>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="200" fill="url(#tile-surface-light)"/>
  <rect x="92.5" y="92.5" width="839" height="839" rx="199.5" fill="none" stroke="url(#edge-light)" stroke-width="1"/>
  <rect x="94" y="94" width="836" height="836" rx="198" fill="url(#lower-shade-light)"/>
  <rect width="1024" height="1024" fill="#f4f1e8" mask="url(#pixel-mark-light)"/>
</svg>
