name: Defect report
description: Report a defect in the native macOS Codex account manager.
title: "[Defect]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include keys, tokens, cookies, transcripts, prompts, or private paths.
  - type: input
    id: version
    attributes:
      label: Application version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 14, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps and observed result
      description: Give the smallest steps and include the failed action or phase.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Remove credentials, account identity, transcript content, and private paths.
