name: Release native macOS package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify core contracts
        run: scripts/check-native.sh
      - name: Build native app and CLI
        run: AI_MANAGER_VERSION="${GITHUB_REF_NAME#v}" scripts/build-native.sh
      - name: Verify CLI workflows
        run: bash packages/tui/Tests/acceptance.sh /private/tmp/ai-manager-build/artifacts/ai-manager
      - name: Archive app and generate checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "/private/tmp/ai-manager-build/package/AI Manager.app" \
            "/private/tmp/ai-manager-build/AI-Manager-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "/private/tmp/ai-manager-build/AI-Manager-${GITHUB_REF_NAME}.zip" \
            "/private/tmp/ai-manager-build/artifacts/ai-manager" \
            > "/private/tmp/ai-manager-build/checksums-${GITHUB_REF_NAME}.txt"
      - name: Create release and upload verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            "/private/tmp/ai-manager-build/AI-Manager-${GITHUB_REF_NAME}.zip" \
            "/private/tmp/ai-manager-build/artifacts/ai-manager" \
            "/private/tmp/ai-manager-build/checksums-${GITHUB_REF_NAME}.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
