name: Native CI

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - packages/**
      - packaging/**
      - scripts/check-linux.sh
      - scripts/build-native.sh
      - scripts/check-native.sh
      - scripts/check-gui-demo.sh
      - scripts/build-gui-acceptance.sh
      - scripts/verify-codex-history.py
      - .github/workflows/native-ci.yml
      - .gitignore
      - README.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Validate Linux core and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build validation image
        run: docker build --tag iia-directeur-linux-check --file packaging/linux/Dockerfile.validation .

      - name: Run isolated Linux contracts
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=8g \
            --tmpfs /home/validator:rw,exec,nosuid,nodev,size=1g \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/source,readonly \
            iia-directeur-linux-check bash -ceu '
              mkdir -p /tmp/src /tmp/home /tmp/build
              git -c safe.directory=/source -C /source ls-files -z \
                | tar -C /source --null --files-from=- --create --file=- \
                | tar -C /tmp/src --extract --file=-
              chown -R validator:validator /tmp/src /tmp/home /tmp/build /home/validator
              exec runuser -u validator -- env \
                HOME=/tmp/home TMPDIR=/tmp AI_MANAGER_BUILD_PATH=/tmp/build \
                bash /tmp/src/scripts/check-linux.sh
            '

  validate:
    name: Build and test native targets
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Apple toolchain
        run: |
          xcode-select --print-path
          xcodebuild -version
          swift --version

      - name: Validate package and run core tests
        run: scripts/check-native.sh

      - name: Build app and CLI artifacts
        run: scripts/build-native.sh

      - name: Verify CLI workflows
        run: bash packages/tui/Tests/acceptance.sh /private/tmp/ai-manager-build/artifacts/ai-manager

      - name: Check generated app metadata
        run: |
          test -x "/private/tmp/ai-manager-build/package/IIA Directeur.app/Contents/MacOS/AIManager"
          test -x "/private/tmp/ai-manager-build/artifacts/ai-manager"
          /usr/bin/plutil -lint "/private/tmp/ai-manager-build/package/IIA Directeur.app/Contents/Info.plist"
          /usr/bin/codesign --verify --deep --strict "/private/tmp/ai-manager-build/package/IIA Directeur.app"
          scripts/check-release-readiness.sh

      - name: Check patch formatting
        run: git diff --check

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-manager-${{ runner.os }}-${{ github.sha }}
          path: |
            /private/tmp/ai-manager-build/package/IIA Directeur.app
            /private/tmp/ai-manager-build/artifacts/ai-manager
          if-no-files-found: error
          retention-days: 7
