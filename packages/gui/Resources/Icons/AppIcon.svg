<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A graphite-blue macOS tile with a licensed account-management glyph. -->
  <defs>
    <linearGradient id="tile-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#586b86"/>
      <stop offset="0.46" stop-color="#3e4d63"/>
      <stop offset="1" stop-color="#2c3544"/>
    </linearGradient>
    <linearGradient id="edge-lift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lower-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="200" fill="url(#tile-surface)"/>
  <rect x="94" y="94" width="836" height="836" rx="198" fill="none" stroke="url(#edge-lift)" stroke-width="4"/>
  <rect x="94" y="94" width="836" height="836" rx="198" fill="url(#lower-edge)"/>
  <g transform="translate(236 236) scale(23)">
    <mask id="dock-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24" style="mask-type:alpha">
      <image xlink:href="ManagerMark.svg" width="24" height="24"/>
    </mask>
    <rect width="24" height="24" fill="#f2f1ed" mask="url(#dock-mark)"/>
  </g>
</svg>
